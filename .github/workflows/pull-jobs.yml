name: Pull jobs

# Started by the page's "Pull new jobs" button (workflow_dispatch) and twice a day (about 06:00 and 18:00 IST;
# GitHub can start scheduled runs late). A feedback run saves rejections/interests and builds CVs for "Interested" jobs.
# A pull scans the boards, reads each new job description, scores it and builds a tailored CV.
# Everything it reads and writes is encrypted with the TRACKER_PASSPHRASE secret; the log prints counts only.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "pull = scan for new jobs and build CVs; feedback = save your choices; check = find closed postings"
        type: choice
        options: [pull, feedback, check]
        default: pull
      feedback:
        description: "Encrypted feedback from the page (leave empty)"
        required: false
        default: ""
      who:
        description: "Profile id the feedback belongs to (leave empty)"
        required: false
        default: ""
  schedule:
    # Odd minutes: GitHub delays runs queued on the hour the most.
    - cron: "17 0 * * *"
    - cron: "17 12 * * *"

permissions:
  contents: write
  issues: write   # the "Job alerts" issue comment that makes GitHub email you

concurrency:
  group: pull-jobs
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      MODE: ${{ inputs.mode || 'pull' }}
    steps:
      # Always the newest main, not the commit the run was queued on: a run queued behind
      # another must start from the feed that run saved.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Read the career-ops version to run
        id: ref
        run: echo "sha=$(tr -dc 0-9a-f < cloud/career-ops-ref)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: career-ops-hq/career-ops
          ref: ${{ steps.ref.outputs.sha }}
          path: .career-ops

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the scanner and the PDF renderer
        working-directory: .career-ops
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm install --omit=dev --ignore-scripts --no-audit --no-fund --loglevel=error  # upstream does not commit a lockfile
          npx playwright install --with-deps chromium > /dev/null

      - name: Pull jobs
        env:
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
          CAREER_OPS_DIR: ${{ github.workspace }}/.career-ops
          FEEDBACK: ${{ inputs.feedback }}
          WHO: ${{ inputs.who }}
          DELTA_FILE: ${{ runner.temp }}/delta.json
        run: node cloud/pull.mjs

      - name: Save the feed
        env:
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
          DELTA_FILE: ${{ runner.temp }}/delta.json
        run: |
          git config user.name "job-tracker bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            # profiles/ and team.enc.js are written only by these serialized runs, so a replay keeps them as they are.
            for p in feed.enc.js cvs profiles team.enc.js; do if [ -e "$p" ]; then git add -A "$p"; fi; done
            if git diff --cached --quiet; then echo "No change."; exit 0; fi
            git commit -q -m "Pull jobs ($MODE) $(date -u +%F)"
            if git push -q origin HEAD:main; then exit 0; fi
            echo "Someone saved first; replaying this run on the newer feed (attempt $i)."
            git fetch -q origin main
            git reset -q --mixed origin/main
            git checkout -q origin/main -- feed.enc.js
            node cloud/pull.mjs --apply-delta "$DELTA_FILE"
            sleep 3
          done
          exit 1

      - name: Tell you what it found
        env:
          TRACKER_PASSPHRASE: ${{ secrets.TRACKER_PASSPHRASE }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DELTA_FILE: ${{ runner.temp }}/delta.json
        run: node cloud/notify.mjs
